# Builds signed APKs and publishes a GitHub release when a vMAJOR.MINOR.PATCH tag is pushed.
# See docs/release.md for the secrets and how to cut a release.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the release notes

      - name: Read the version from the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not in the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Without these, Gradle would silently sign with a throwaway debug key and users couldn't update.
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" --build-number="${{ github.run_number }}"
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/YouPipe-v$VERSION-$abi.apk"
          done

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # What changed since the last published release, from commit subjects. Squash merges end in "(#12)";
          # drop that so the notes read as plain changes rather than PR links.
          previous=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          changes=""
          if [[ -n "$previous" ]] && git rev-parse -q --verify "refs/tags/$previous" >/dev/null; then
            changes=$(git log --no-merges --format='- %s' "$previous..$GITHUB_REF_NAME" | sed -E 's/ \(#[0-9]+\)$//')
          fi
          {
            echo "## What's new"
            echo
            echo "${changes:-- Bug fixes and improvements}"
            echo
            echo "**Which APK?** Phones, tablets and most Android/Google TVs need \`arm64-v8a\`. Older 32-bit phones and Fire TV sticks need \`armeabi-v7a\`, and \`x86_64\` is for emulators and Chromebooks."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the APKs are uploaded. The in-app updater checks each one against the SHA-256 digest that GitHub
          # reports for it, so no checksum file is needed.
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --verify-tag \
            --title "YouPipe $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
