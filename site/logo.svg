<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- YouPipe concept: the YouPipe Music cylinder, set in a red rounded rectangle (the "screen") instead of the circle badge -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E4E4"/>
    </linearGradient>
    <linearGradient id="bore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A0000"/>
      <stop offset="1" stop-color="#C40000"/>
    </linearGradient>
  </defs>
  <!-- Screen: 10:7, corner radius ~22% of the height -->
  <rect x="16" y="40" width="160" height="112" rx="26" fill="#FF0000"/>
  <!-- Pipe: a horizontal cylinder in 3/4 view, open end facing right (same drawing as YouPipe Music, scaled 0.85) -->
  <path d="M74 77 H119 A9.5 19 0 0 1 119 115 H74 A9.5 19 0 0 1 74 77 Z" fill="url(#body)"/>
  <ellipse cx="119" cy="96" rx="9.5" ry="19" fill="#FFFFFF"/>
  <ellipse cx="119" cy="96" rx="6" ry="13.6" fill="url(#bore)"/>
</svg>
