<!doctype html>
<html><head><meta charset="utf-8"><title>YouPipe logo concept</title>
<style>
  body{margin:0;font-family:Roboto,Arial,sans-serif;background:#f1f1f1;color:#0f0f0f;padding:24px}
  .row{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-end}
  figure{margin:0;text-align:center;font-size:13px;color:#606060}
  .icon{width:120px;height:120px;border-radius:28px;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px #0003}
  .icon img{width:110px}
  .bar{background:#0f0f0f;padding:14px 16px;width:360px;display:flex;align-items:center;justify-content:space-between;border-radius:8px}
  .bar span{color:#f1f1f1;font-size:20px;letter-spacing:12px}
  .small img{width:24px}
</style></head><body>
<div class="row">
  <figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- YouPipe concept: the YouPipe Music cylinder, set in a red rounded rectangle (the "screen") instead of the circle badge -->
  <defs>
    <linearGradient id="body1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E4E4"/>
    </linearGradient>
    <linearGradient id="bore1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A0000"/>
      <stop offset="1" stop-color="#C40000"/>
    </linearGradient>
  </defs>
  <!-- Screen: 10:7, corner radius ~22% of the height -->
  <rect x="16" y="40" width="160" height="112" rx="26" fill="#FF0000"/>
  <!-- Pipe: a horizontal cylinder in 3/4 view, open end facing right (same drawing as YouPipe Music, scaled 0.85) -->
  <path d="M74 77 H119 A9.5 19 0 0 1 119 115 H74 A9.5 19 0 0 1 74 77 Z" fill="url(#body1)"/>
  <ellipse cx="119" cy="96" rx="9.5" ry="19" fill="#FFFFFF"/>
  <ellipse cx="119" cy="96" rx="6" ry="13.6" fill="url(#bore1)"/>
</svg><figcaption>YouPipe mark</figcaption></figure>
  <figure><div class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="104" height="104">
  <!-- YouPipe concept: the YouPipe Music cylinder, set in a red rounded rectangle (the "screen") instead of the circle badge -->
  <defs>
    <linearGradient id="body3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E4E4"/>
    </linearGradient>
    <linearGradient id="bore3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A0000"/>
      <stop offset="1" stop-color="#C40000"/>
    </linearGradient>
  </defs>
  <!-- Screen: 10:7, corner radius ~22% of the height -->
  <rect x="16" y="40" width="160" height="112" rx="26" fill="#FF0000"/>
  <!-- Pipe: a horizontal cylinder in 3/4 view, open end facing right (same drawing as YouPipe Music, scaled 0.85) -->
  <path d="M74 77 H119 A9.5 19 0 0 1 119 115 H74 A9.5 19 0 0 1 74 77 Z" fill="url(#body3)"/>
  <ellipse cx="119" cy="96" rx="9.5" ry="19" fill="#FFFFFF"/>
  <ellipse cx="119" cy="96" rx="6" ry="13.6" fill="url(#bore3)"/>
</svg></div><figcaption>Launcher icon (white adaptive bg)</figcaption></figure>
  <figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="120" height="120">
  <defs>
    <linearGradient id="body5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E4E4"/>
    </linearGradient>
    <linearGradient id="bore5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A0000"/>
      <stop offset="1" stop-color="#C40000"/>
    </linearGradient>
  </defs>
  <!-- Badge -->
  <circle cx="96" cy="96" r="96" fill="#FF0000"/>
  <circle cx="96" cy="96" r="57" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <!-- Pipe: a horizontal cylinder seen in 3/4 view, open end facing right -->
  <path d="M68 74 H121 A11 22 0 0 1 121 118 H68 A11 22 0 0 1 68 74 Z" fill="url(#body5)"/>
  <ellipse cx="121" cy="96" rx="11" ry="22" fill="#FFFFFF"/>
  <ellipse cx="121" cy="96" rx="7" ry="16" fill="url(#bore5)"/>
</svg><figcaption>YouPipe Music (sibling)</figcaption></figure>
  <figure class="small"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="24" height="24">
  <!-- YouPipe concept: the YouPipe Music cylinder, set in a red rounded rectangle (the "screen") instead of the circle badge -->
  <defs>
    <linearGradient id="body7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E4E4"/>
    </linearGradient>
    <linearGradient id="bore7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A0000"/>
      <stop offset="1" stop-color="#C40000"/>
    </linearGradient>
  </defs>
  <!-- Screen: 10:7, corner radius ~22% of the height -->
  <rect x="16" y="40" width="160" height="112" rx="26" fill="#FF0000"/>
  <!-- Pipe: a horizontal cylinder in 3/4 view, open end facing right (same drawing as YouPipe Music, scaled 0.85) -->
  <path d="M74 77 H119 A9.5 19 0 0 1 119 115 H74 A9.5 19 0 0 1 74 77 Z" fill="url(#body7)"/>
  <ellipse cx="119" cy="96" rx="9.5" ry="19" fill="#FFFFFF"/>
  <ellipse cx="119" cy="96" rx="6" ry="13.6" fill="url(#bore7)"/>
</svg><figcaption>24 px</figcaption></figure>
</div>
<div class="row" style="margin-top:32px">
  <figure><div class="bar"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 30" width="106" height="24">
  <!-- Top-bar wordmark: the screen + pipe mark, then "YouPipe" in Roboto (dark theme: white text) -->
  <defs>
    <linearGradient id="bore9" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A0000"/>
      <stop offset="1" stop-color="#C40000"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="34" height="24" rx="6" fill="#FF0000"/>
  <path d="M12.5 10.5 H22 A2 4.5 0 0 1 22 19.5 H12.5 A2 4.5 0 0 1 12.5 10.5 Z" fill="#FFFFFF"/>
  <ellipse cx="22" cy="15" rx="2" ry="4.5" fill="#FFFFFF"/>
  <ellipse cx="22" cy="15" rx="1.25" ry="3.2" fill="url(#bore9)"/>
  <text x="38" y="23" font-family="Roboto, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="-0.8" fill="#FFFFFF">YouPipe</text>
</svg><span>⌕ ⋮</span></div><figcaption>Top app bar (dark)</figcaption></figure>
</div>
</body></html>
